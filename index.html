<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#DEE1D3" />
  <title>For Sana ♡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Playfair+Display:wght@600;700;800&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Page-load reveal: soft curtain parts to unveil the page -->
  <div class="intro-curtain" id="introCurtain" aria-hidden="true">
    <div class="intro-panel intro-left"></div>
    <div class="intro-panel intro-right"></div>
    <div class="intro-mark">♥</div>
  </div>

  <!-- Initial interactive balloon trigger -->
  <div class="balloon-overlay" id="balloonOverlay">
    <div class="balloon-prompt">
      <div class="balloon" id="loveBalloon" role="button" tabindex="0" aria-label="Burst the balloon">
        <span class="balloon-knot"></span>
        <span class="balloon-shine"></span>
      </div>
      <div class="balloon-text">tap to burst balloon 🎈</div>
    </div>
    <div class="confetti-field" id="confettiField" aria-hidden="true"></div>
  </div>


  <!-- Decorative romantic background. These stay behind all main content. -->
  <div class="romance-bg">
    <span class="heart h1" role="button" tabindex="0" aria-label="Tap for a love note">♥</span>
    <span class="heart h2" role="button" tabindex="0" aria-label="Tap for a love note">♡</span>
    <span class="heart h3" role="button" tabindex="0" aria-label="Tap for a love note">♥</span>
    <span class="heart h4" role="button" tabindex="0" aria-label="Tap for a love note">♡</span>
    <span class="heart h5" role="button" tabindex="0" aria-label="Tap for a love note">♥</span>
    <span class="heart h6" role="button" tabindex="0" aria-label="Tap for a love note">♡</span>
    <span class="heart h7" role="button" tabindex="0" aria-label="Tap for a love note">♥</span>
    <span class="heart h8" role="button" tabindex="0" aria-label="Tap for a love note">♡</span>
    <span class="spark s1" aria-hidden="true">✦</span>
    <span class="spark s2" aria-hidden="true">✧</span>
    <span class="spark s3" aria-hidden="true">✦</span>
    <span class="petal p1" aria-hidden="true"></span>
    <span class="petal p2" aria-hidden="true"></span>
    <span class="petal p3" aria-hidden="true"></span>
    <span class="petal p4" aria-hidden="true"></span>
    <span class="bow b1" aria-hidden="true">🎀</span>
  </div>

  <main class="page">

    <!-- TOP SECTION -->
    <section class="top-section">

      <!-- CSS-built music player model -->
      <div class="music-player" aria-label="Decorative music player">
        <div class="vinyl">
          <div class="vinyl-label">♡</div>
          <div class="vinyl-shine"></div>
        </div>
        <div class="tonearm">
          <span class="tonearm-head"></span>
        </div>
        <div class="player-caption">a little song for you</div>
        <button class="song-switch" id="songSwitch" type="button" aria-label="Change song">♪</button>
      </div>

      <div class="song-toast" id="songToast"></div>

      <!-- Seamless Catbox video -->
      <div class="corner-video">
        <video
          id="cornerVideo"
          autoplay
          muted
          loop
          playsinline
          preload="auto"
          src="https://files.catbox.moe/qdc3x7.mp4">
        </video>
      </div>

      <!-- Song source is set from the SONGS list in script.js -->
      <audio id="loveSong" autoplay loop preload="auto" src="track1.mp3"></audio>

    </section>

    <!-- LOVE LINE -->
    <section class="love-line-section">
      <div class="love-line-wrap">
        <p class="love-line" id="loveLine">I love Sana so much</p>
        <p class="love-tagline">forever &amp; always</p>
      </div>
    </section>

    <!-- COUPLE -->
    <section class="couple-section">
      <div class="couple-wrap">
        <img
          class="couple-sticker"
          src="https://files.catbox.moe/l9xdjq.png"
          alt="Cute couple"
        />
      </div>
    </section>

    <!-- NAMES -->
    <section class="names-section">
      <div class="name sana">SANA</div>
      <div class="monogram" aria-hidden="true">
        <span class="monogram-ring"></span>
        <span class="monogram-amp">&amp;</span>
      </div>
      <div class="name neeraj">NEERAJ</div>
    </section>

    <!-- STATIC 3D ENGRAVED FOOTER -->
    <footer class="footer">
      <div class="engraved">CODED BY NEERAJ</div>
    </footer>

  </main>

  <script src="script.js"></script>
</body>
</html>
